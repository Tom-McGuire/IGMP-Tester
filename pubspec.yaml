name: igmp_tester
description: "IGMP & Multicast Network Tester for Desktop (Windows, macOS, Linux)."
publish_to: 'none'

version: 0.6.0-Beta

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  network_suite_shared:
    git:
      url: https://github.com/Tom-McGuire/network-suite-shared.git
      ref: main
  sqlite3: ^3.7.1
  path: ^1.9.1

  provider: ^6.1.5+1
  intl: ^0.20.2
  csv: ^8.0.0
  file_picker: ^13.1.0
  fl_chart: ^1.2.0

  material_ui: ^1.11.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
